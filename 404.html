<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · SIGNAL LOST — NEON PINBALL</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05070f" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/game.css" />
</head>

<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__grid"></div>
    <div class="bg__glow bg__glow--a"></div>
    <div class="bg__glow bg__glow--b"></div>
    <div class="bg__scan"></div>
  </div>

  <main class="error-page">
    <p class="kicker">CONNECTION LOST <span>//</span> 404</p>
    <p class="error-page__code" aria-hidden="true">404</p>
    <h1 class="error-page__title">这条通道不存在。</h1>
    <p class="error-page__lead">
      你访问的页面已被移出弹珠台，或者从未通电。<br />
      回到街机厅，继续把球打完。
    </p>

    <a class="cta" href="/">
      <span class="cta__main">RE-ENTER</span>
      <span class="cta__sub">回到弹珠台</span>
    </a>
  </main>
</body>
</html>
