<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NEON PINBALL">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39F6FF" />
      <stop offset="0.5" stop-color="#8B5CFF" />
      <stop offset="1" stop-color="#FF3BD4" />
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%">
      <stop stop-color="#FFFFFF" />
      <stop offset="0.55" stop-color="#BDEFFF" />
      <stop offset="1" stop-color="#3E7C9E" />
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#05070F" />
  <rect x="2.2" y="2.2" width="59.6" height="59.6" rx="12" fill="none" stroke="url(#edge)" stroke-opacity="0.8" stroke-width="1.4" />

  <circle cx="32" cy="25" r="16.5" fill="none" stroke="url(#edge)" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 5" />

  <g filter="url(#glow)">
    <path d="M13.5 51.5 30 40.5" stroke="#FF3BD4" stroke-width="5" stroke-linecap="round" />
    <path d="M50.5 51.5 34 40.5" stroke="#39F6FF" stroke-width="5" stroke-linecap="round" />
    <circle cx="32" cy="25" r="8" fill="url(#ball)" stroke="#E9FDFF" stroke-width="0.8" />
  </g>

  <circle cx="29.4" cy="22.4" r="2" fill="#FFFFFF" opacity="0.9" />
</svg>
