<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="风华 Fenghua 头像">
  <defs>
    <radialGradient id="bg" cx="28%" cy="18%" r="90%">
      <stop offset="0" stop-color="#12263A" />
      <stop offset="0.55" stop-color="#0A1020" />
      <stop offset="1" stop-color="#05070D" />
    </radialGradient>
    <linearGradient id="mono" x1="118" y1="120" x2="368" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDEBFF" />
      <stop offset="0.48" stop-color="#7DD3FC" />
      <stop offset="0.78" stop-color="#A78BFA" />
      <stop offset="1" stop-color="#F0ABFC" />
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop stop-color="#A78BFA" stop-opacity="0.5" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC" stop-opacity="0.7" />
      <stop offset="0.6" stop-color="#A78BFA" stop-opacity="0.25" />
      <stop offset="1" stop-color="#F0ABFC" stop-opacity="0.5" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>

  <rect width="480" height="480" fill="url(#bg)" />
  <rect width="480" height="480" fill="url(#grid)" />
  <circle cx="120" cy="96" r="150" fill="url(#glowA)" filter="url(#blur)" />
  <circle cx="392" cy="410" r="160" fill="url(#glowB)" filter="url(#blur)" />

  <circle cx="240" cy="240" r="196" fill="none" stroke="url(#ring)" stroke-width="1" />
  <circle cx="240" cy="240" r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="3 9" />
  <circle cx="240" cy="240" r="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" />

  <circle cx="240" cy="240" r="108" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12" />
  <text x="240" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-6" fill="url(#mono)">FH</text>

  <g fill="#FFFFFF" fill-opacity="0.55" font-family="Consolas, monospace" font-size="11" letter-spacing="6">
    <text x="240" y="418" text-anchor="middle">FENGHUA · 711150</text>
  </g>
  <circle cx="352" cy="136" r="4" fill="#7DD3FC" />
  <circle cx="112" cy="352" r="3" fill="#A78BFA" />
